<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(0.975 0.01 85);color:oklch(0.27 0.02 60);font-family:'Zen Maru Gothic',sans-serif;-webkit-font-smoothing:antialiased}a{color:oklch(0.45 0.1 235)}a:hover{color:oklch(0.35 0.12 235)}*{box-sizing:border-box}</style>
</helmet>
<div style="max-width:1320px;margin:0 auto;padding:36px 24px 80px;display:flex;flex-direction:column;gap:18px">
<header style="display:flex;flex-direction:column;gap:8px">
<div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:oklch(0.5 0.02 60)">アイス島 改造プラン ／ 完成イメージ</div>
<h1 style="margin:0;font-size:clamp(26px,3.6vw,38px);font-weight:700;line-height:1.2">完成イメージ（俯瞰）</h1>
<p style="margin:0;max-width:860px;font-size:14px;line-height:1.8;text-wrap:pretty">計画の地形（段・川・滝・坂・橋）と、配置（組み立て台に置いたもの。なければ見本）を、斜め45度の上から描いたイメージ図です。島のどこでも描けます。建物と家具は簡略化した形です。実際のゲーム画面に近い見え方は <a href="Game View.dc.html">ゲーム画面 →</a></p>
</header>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span style="font-size:12px;color:oklch(0.5 0.02 60)">見る範囲</span>
<sc-for list="{{ views }}" as="v" hint-placeholder-count="9"><button onClick="{{ v.pick }}" style="font:inherit;font-size:13px;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;line-height:1.2;background:{{ v.bg }};color:{{ v.fg }}">{{ v.name }}</button></sc-for></div>
<div style="display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center">
<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:oklch(0.5 0.02 60)">時間</span>
<sc-for list="{{ times }}" as="v" hint-placeholder-count="3"><button onClick="{{ v.pick }}" style="font:inherit;font-size:13px;border:1px solid oklch(0.85 0.02 85);border-radius:8px;padding:5px 10px;cursor:pointer;background:{{ v.bg }};color:{{ v.fg }}">{{ v.name }}</button></sc-for></div>
<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:oklch(0.5 0.02 60)">名前</span>
<sc-for list="{{ namesOpt }}" as="v" hint-placeholder-count="3"><button onClick="{{ v.pick }}" style="font:inherit;font-size:13px;border:1px solid oklch(0.85 0.02 85);border-radius:8px;padding:5px 10px;cursor:pointer;background:{{ v.bg }};color:{{ v.fg }}">{{ v.name }}</button></sc-for></div>
<button onClick="{{ savePng }}" style="font:inherit;font-size:13px;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;background:#a8402a;color:white">PNGで保存</button>
</div>
<canvas ref="{{ cvRef }}" style="width:100%;display:block;border-radius:14px;background:#7fd6c3"></canvas>
<div style="display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:oklch(0.42 0.02 60)">
<span>{{ source }}</span>
<a href="Module Builder.dc.html">組み立て台で配置を変える →</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  cv = React.createRef();
  state = { source: '', view: 'lon', time: 'day', names: 'all', ready: 0 };
  VIEWS = {
    lon: ['ロンドン', [16, 52, 65, 94]], egy: ['エジプト', [8, 12, 40, 62]], jpn: ['日本', [32, 12, 67, 61]], usa: ['アメリカ', [65, 12, 101, 47]],
    eur: ['ヨーロッパ', [57, 39, 101, 85]], port: ['地中海の港', [64, 70, 112, 94]], museum: ['エジプト考古学博物館のまわり', [14, 16, 48, 40]],
    wide: ['ロンドン＋周辺', [4, 34, 84, 96]], all: ['島全体', [0, 4, 112, 96]]
  };
  TIMES = [['day', '昼'], ['dusk', '夕方'], ['night', '夜']];
  NAMES = [['all', '地点と地区'], ['dist', '地区だけ'], ['none', 'なし']];
  // 地区の境目（組み立て台・tools/gen_samples.py と同じ。上から順に判定）
  ZONES = [['hal', [[86, 0], [112, 0], [112, 25], [86, 25]]], ['usa', [[82, 25], [112, 25], [112, 46], [82, 46]]], ['usa', [[66, 0], [86, 0], [86, 25], [82, 25], [82, 46], [76, 46], [66, 40]]],
    ['egy', [[0, 0], [38, 0], [38, 30], [34, 34], [34, 52], [30, 56], [18, 56], [18, 84], [0, 84]]], ['jpn', [[38, 0], [66, 0], [66, 40], [62, 48], [62, 60], [34, 60], [34, 34], [38, 30]]],
    ['port', [[76, 72], [112, 72], [112, 96], [58, 96], [58, 84], [76, 84]]], ['eur', [[66, 40], [76, 46], [112, 46], [112, 72], [76, 72], [76, 84], [58, 84], [58, 60], [62, 60], [62, 48]]],
    ['lon', [[0, 84], [18, 84], [18, 56], [30, 56], [34, 52], [34, 60], [58, 60], [58, 96], [0, 96]]]];
  zoneAt(x, y) { const px = x + .5, py = y + .5; for (const [k, p] of this.ZONES) { let ins = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) ins = !ins; } if (ins) return k; } return 'lon'; }
  componentDidMount() {
    fetch('plan-terrain.json').then(r => r.json()).then(j => { this.T = j; this.setState({ ready: Date.now() }); });
    fetch('samples.json').then(r => r.json()).then(j => { this.SM = j; this.setState({ ready: Date.now() }); }).catch(() => {});
    if (document.fonts) document.fonts.ready.then(() => { this.dk = null; this.draw(); });
  }
  componentDidUpdate() { this.draw(); }
  renderVals() {
    const s = this.state, chip = (cur, set) => ([k, n]) => ({ name: n, pick: () => this.setState({ [set]: k }), bg: cur === k ? '#4a3b30' : 'white', fg: cur === k ? 'white' : '#4a3b30' });
    return {
      cvRef: this.cv, source: s.source,
      views: Object.entries(this.VIEWS).map(([k, v]) => chip(s.view, 'view')([k, v[0]])),
      times: this.TIMES.map(chip(s.time, 'time')), namesOpt: this.NAMES.map(chip(s.names, 'names')),
      savePng: () => { const c = this.cv.current; if (!c) return; c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `アイス島_完成イメージ_${s.view}_${s.time}.png`; a.click(); }); }
    };
  }
  rot(r, n) { let a = r.map(s => s.split('')); for (let i = 0; i < n; i++) { const h = a.length, w = a[0].length, o = []; for (let y = 0; y < w; y++) { o.push([]); for (let x = 0; x < h; x++) o[y].push(a[h - 1 - x][y]); } a = o; } return a; }
  // 配置を読む：組み立て台の保存（localStorage）があればそれ、なければ見本
  loadPlacement() {
    let placed = null, paint = {}, defs = {}, src = '';
    try { const s = JSON.parse(localStorage.getItem('wti-module-board') || 'null'); if (s && ((s.placed || []).length || Object.keys(s.paint || {}).length)) { placed = (s.placed || []).map(p => [p.m, p.x, p.y, p.rot || 0]); paint = s.paint || {}; defs = s.defs || {}; src = '組み立て台の配置で描画中'; } } catch (e) {}
    const SM = this.SM;
    if (SM) { defs = Object.assign({}, SM.defs, defs); if (!placed) { placed = Object.values(SM.dists).flat(); paint = {}; Object.values(SM.paint).forEach(p => Object.assign(paint, p)); src = '見本の配置で描画中'; } }
    return { placed: placed || [], paint, defs, src: src || '配置を読み込み中…' };
  }
  draw() {
    const T = this.T, c = this.cv.current; if (!T || !c) return;
    const s = this.state, P0 = this.loadPlacement();
    const key = [s.view, s.time, s.names, this.SM ? 1 : 0, P0.placed.length, Object.keys(P0.paint).length, P0.src].join('|');
    if (this.dk === key) return; this.dk = key;
    if (s.source !== P0.src) this.setState({ source: P0.src });
    const G = T.grid, HL = T.h, [bx0, by0, bx1, by1] = this.VIEWS[s.view][1], nx = bx1 - bx0, ny = by1 - by0;
    const TW = nx + ny > 120 ? 12 : 16, TH = TW / 2, HZ = TW * .45;
    const ZL = [0, 2, 6, 10];
    c.width = (nx + ny) * TW + 120; c.height = (nx + ny) * TH + 21 * HZ + 120;
    const ctx = c.getContext('2d'), ox = ny * TW + 60, oy = 10 * HZ + 70;
    const at = (x, y) => (G[y] || '')[x], lvl = (x, y) => +((HL[y] || '')[x] || 0);
    const PJ = (x, y, z) => [ox + (x - bx0 - (y - by0)) * TW, oy + (x - bx0 + y - by0) * TH - z * HZ];
    const shade = (col, f) => { let r, g, b; if (col[0] === '#') { const n = parseInt(col.slice(1), 16); r = (n >> 16) & 255; g = (n >> 8) & 255; b = n & 255; } else { [r, g, b] = col.match(/\d+(\.\d+)?/g).map(Number); } return `rgb(${Math.min(255, Math.round(r * f))},${Math.min(255, Math.round(g * f))},${Math.min(255, Math.round(b * f))})`; };
    const poly = (pts, fill, stroke) => { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.fillStyle = fill; ctx.fill(); if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = 1; ctx.stroke(); } };
    const prism = (x, y, w, d, z0, z1, col) => {
      poly([PJ(x, y + d, z1), PJ(x + w, y + d, z1), PJ(x + w, y + d, z0), PJ(x, y + d, z0)], shade(col, .8));
      poly([PJ(x + w, y, z1), PJ(x + w, y + d, z1), PJ(x + w, y + d, z0), PJ(x + w, y, z0)], shade(col, .62));
      poly([PJ(x, y, z1), PJ(x + w, y, z1), PJ(x + w, y + d, z1), PJ(x, y + d, z1)], col);
    };
    // ---- 配置の整理 ----
    const fur = {}, gnd = {}, blds = [], mons = [], mills = [], lights = [];
    const GR = 'BpSgdwZD=';
    const GC = { B: '#b8694b', p: '#cdbb91', S: '#ead39b', g: '#dedbd2', d: '#c9a074', m: '#f7f5ef' };
    P0.placed.forEach(([id, px, py, r]) => {
      const rows = P0.defs[id]; if (!rows) return; const a = this.rot(rows, r || 0);
      let hb = null, ms = null, ss = [];
      a.forEach((row, dy) => row.forEach((ch, dx) => { if (ch === '.') return; const x = px + dx, y = py + dy;
        if (ch === 'H') { hb = hb || { x1: 1e9, y1: 1e9, x2: -1, y2: -1 }; hb.x1 = Math.min(hb.x1, x); hb.y1 = Math.min(hb.y1, y); hb.x2 = Math.max(hb.x2, x); hb.y2 = Math.max(hb.y2, y); }
        else if (ch === 'M') { ms = ms || { x1: 1e9, y1: 1e9, x2: -1, y2: -1 }; ms.x1 = Math.min(ms.x1, x); ms.y1 = Math.min(ms.y1, y); ms.x2 = Math.max(ms.x2, x); ms.y2 = Math.max(ms.y2, y); }
        else if (ch === 's') ss.push([x, y]);
        else if (ch === 'l') { }   // 空けるマス（木・岩・花のまわり）は草地のまま
        else if (GC[ch]) { if (!gnd[x + ',' + y]) gnd[x + ',' + y] = ch; }
        else if (ch === 'D' || ch === 'w' || ch === '=' || ch === 'Z') { }
        else fur[x + ',' + y] = ch; }));
      if (hb) blds.push({ x: hb.x1, y: hb.y1, w: hb.x2 - hb.x1 + 1, d: hb.y2 - hb.y1 + 1, id });
      if (ms) mills.push({ x: ms.x1, y: ms.y1, w: ms.x2 - ms.x1 + 1, d: ms.y2 - ms.y1 + 1 });
      if (ss.length >= 6) { const xs = ss.map(p => p[0]), ys = ss.map(p => p[1]); mons.push({ x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs) + 1, d: Math.max(...ys) - Math.min(...ys) + 1 }); }
      else ss.forEach(([x, y]) => { fur[x + ',' + y] = 's'; });
    });
    blds.push({ x: 28, y: 63, w: 6, d: 4, id: '_info' }); blds.push({ x: 44, y: 85, w: 8, d: 5, id: '_airport' });
    const paint = {};
    Object.entries(P0.paint).forEach(([k, v]) => { if (v.startsWith('r:')) paint[k] = v; else gnd[k] = v; });
    // ---- 高さ ----
    const slope = {};   // 坂のマスの四隅の高さ
    (T.inclines || []).forEach(([sx, sy, d]) => {
      const hi = lvl(sx, sy), z1 = ZL[hi], z0 = ZL[hi - 1];
      for (let i = 0; i < 4; i++) for (let k = 0; k < 2; k++) {
        const x = d === 'E' || d === 'W' ? sx + i : sx + k, y = d === 'E' || d === 'W' ? sy + k : sy + i;
        const f = d === 'S' || d === 'E' ? i : 3 - i;          // 上の端からの距離
        const zs = t => z1 + (z0 - z1) * Math.max(0, Math.min(1, t / 3.0));
        const a = zs(f), b = zs(f + 1);                         // 手前・奥の端
        let nw, ne, se, sw;
        if (d === 'S') { nw = ne = a; sw = se = b; } else if (d === 'N') { nw = ne = b; sw = se = a; } else if (d === 'E') { nw = sw = a; ne = se = b; } else { nw = sw = b; ne = se = a; }
        slope[x + ',' + y] = [nw, ne, se, sw];
      }
    });
    const sh = (x, y) => { const v = at(x, y), l = lvl(x, y); if (v === undefined) return -1; if (v === 'S') return .3; if (v === 'w') return ZL[l] - .8; if (v === 's') return 1.6; if (v === 'r') return 2.4; if (v === 'b') return ZL[l] + .25; return ZL[l]; };
    const corners = (x, y) => slope[x + ',' + y] || (z => [z, z, z, z])(sh(x, y));
    const ROAD = { lon: '#605b58', egy: '#c99a5a', jpn: '#b9b4aa', usa: '#4a4d52', hal: '#4b4057', eur: '#bdb7ac', port: '#f2efe6' };
    const GRASS = ['#4c9f48', '#5aaa4d', '#6dbb57', '#80cc62'];
    const TOPC = { S: '#79d3c0', s: '#f2e5a8', r: '#8a8798', w: '#94e3d4', p: '#cfbb8e', P: '#d9c9a0', K: '#b8694b', b: '#9a96a0' };
    let seed = 11; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const SIDE = { S: '#5dbcab', s: '#d9c98e', r: '#6e6b7c', w: '#6fb7ac', b: '#7a767f' };
    // ---- 地面（奥から手前へ） ----
    const falls = [];
    for (let sd = 0; sd < nx + ny; sd++) for (let x = bx0; x < bx1; x++) {
      const y = by0 + sd - (x - bx0); if (y < by0 || y >= by1) continue;
      const v = at(x, y), l = lvl(x, y), k = x + ',' + y, cn = corners(x, y), road = paint[k], zone = this.zoneAt(x, y);
      let col = TOPC[v] || GRASS[Math.max(1, l)];
      if (v === 't') col = GRASS[Math.max(1, l)];
      if (gnd[k] && v !== 'S' && v !== 'w') col = GC[gnd[k]];
      if (road && v !== 'S' && v !== 'w') col = ROAD[road.slice(2)] || ROAD.lon;
      // 側面：となりが低い所（南・東）
      for (const [dx, dy, f] of [[0, 1, .8], [1, 0, .62]]) {
        const nxp = x + dx, nyp = y + dy, nb = corners(nxp, nyp);
        const mine = dx ? [cn[1], cn[2]] : [cn[3], cn[2]], theirs = dx ? [nb[0], nb[3]] : [nb[0], nb[1]];
        if (nxp >= bx1 && false) continue;
        const top = mine, bot = (at(nxp, nyp) === undefined) ? [0, 0] : theirs;
        if (top[0] - bot[0] < .05 && top[1] - bot[1] < .05) continue;
        const pa = dx ? [PJ(x + 1, y, top[0]), PJ(x + 1, y + 1, top[1]), PJ(x + 1, y + 1, bot[1]), PJ(x + 1, y, bot[0])] : [PJ(x, y + 1, top[0]), PJ(x + 1, y + 1, top[1]), PJ(x + 1, y + 1, bot[1]), PJ(x, y + 1, bot[0])];
        const nv = at(nxp, nyp);
        const isFall = v === 'w' && nv === 'w';
        let sc = isFall ? '#dff6f6' : (SIDE[v] || (road || gnd[k] ? '#a08a68' : '#9a7a55'));
        if (!isFall && nv === 'w' && (v !== 'w')) sc = SIDE[v] || '#8a6d4d';
        poly(pa, shade(sc, f));
        if (isFall) { ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 1; for (let i = 1; i < 4; i++) { const a = [pa[0][0] + (pa[1][0] - pa[0][0]) * i / 4, pa[0][1] + (pa[1][1] - pa[0][1]) * i / 4], b = [pa[3][0] + (pa[2][0] - pa[3][0]) * i / 4, pa[3][1] + (pa[2][1] - pa[3][1]) * i / 4]; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); } falls.push([x + (dx ? 1 : .5), y + (dy ? 1 : .5), Math.min(bot[0], bot[1])]); }
        else if (!SIDE[v] && top[0] - bot[0] > 1.2) {       // 地層の線
          ctx.strokeStyle = 'rgba(70,45,25,.35)'; ctx.lineWidth = 1; for (let z = Math.floor(Math.min(top[0], top[1])) - 1; z > Math.max(bot[0], bot[1]); z -= 1.5) { const a = dx ? PJ(x + 1, y, z) : PJ(x, y + 1, z), b = dx ? PJ(x + 1, y + 1, z) : PJ(x + 1, y + 1, z); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
        }
      }
      // 上面
      poly([PJ(x, y, cn[0]), PJ(x + 1, y, cn[1]), PJ(x + 1, y + 1, cn[2]), PJ(x, y + 1, cn[3])], shade(col, .96 + rnd() * .06));
      // 模様
      const c0 = PJ(x + .5, y + .5, (cn[0] + cn[2]) / 2);
      if (v === 'w' || v === 'S') { if (rnd() < .22) { ctx.fillStyle = 'rgba(255,255,255,.38)'; ctx.fillRect(c0[0] - 4, c0[1], 6, 1.3); } }
      else if (road || gnd[k] === 'B' || v === 'K') {
        const z2 = road ? road.slice(2) : (gnd[k] === 'B' || v === 'K' ? 'B' : 'lon');
        ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.lineWidth = 1;
        if (z2 === 'lon' || z2 === 'hal') { ctx.beginPath(); ctx.arc(c0[0] - 3, c0[1], 2, 0, 7); ctx.arc(c0[0] + 3, c0[1] + 1, 2, 0, 7); ctx.fill(); }
        else if (z2 === 'egy' || z2 === 'jpn') { ctx.beginPath(); ctx.moveTo(c0[0] - TW / 2, c0[1]); ctx.lineTo(c0[0] + TW / 2, c0[1]); ctx.stroke(); }
        else if (z2 === 'eur') { ctx.beginPath(); ctx.arc(c0[0], c0[1] + 2, 4, Math.PI, 0); ctx.stroke(); }
        else if (z2 === 'B') { ctx.strokeStyle = 'rgba(90,40,25,.35)'; ctx.beginPath(); ctx.moveTo(c0[0] - 4, c0[1] - 1); ctx.lineTo(c0[0] + 4, c0[1] + 1); ctx.stroke(); }
        else if (z2 === 'usa') { const rw = (dx, dy) => !!paint[(x + dx) + ',' + (y + dy)]; if (rw(1, 0) && rw(-1, 0) && !(rw(0, 1) && rw(0, -1)) && x % 3 === 0) { ctx.fillStyle = '#f4d44a'; ctx.fillRect(c0[0] - 3, c0[1] - .5, 6, 1.6); } }
        else if (z2 === 'port') { const rw = (dx, dy) => !!paint[(x + dx) + ',' + (y + dy)]; if (!rw(0, 1)) { poly([PJ(x, y + .8, cn[3]), PJ(x + 1, y + .8, cn[2]), PJ(x + 1, y + 1, cn[2]), PJ(x, y + 1, cn[3])], '#5b9aa0'); } }
      } else if (gnd[k] === 'm') {      // 砂紋（箒目）：白砂に引いた波の線
        ctx.strokeStyle = 'rgba(140,128,105,.45)'; ctx.lineWidth = 1;
        for (const f of [.3, .62]) { const a = PJ(x, y + f, cn[0]), b = PJ(x + 1, y + f, cn[1]), m1 = PJ(x + .5, y + f - .12, cn[0]); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo(m1[0], m1[1], b[0], b[1]); ctx.stroke(); }
