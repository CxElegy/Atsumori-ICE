<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;background:oklch(0.975 0.01 85);color:oklch(0.27 0.02 60);font-family:'Zen Maru Gothic',sans-serif;-webkit-font-smoothing:antialiased}a{color:oklch(0.45 0.1 235)}a:hover{color:oklch(0.35 0.12 235)}*{box-sizing:border-box}</style>
</helmet>
<div style="max-width:1320px;margin:0 auto;padding:36px 24px 80px;display:flex;flex-direction:column;gap:14px">
<header style="display:flex;flex-direction:column;gap:8px">
<div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;color:oklch(0.5 0.02 60)">アイス島 改造プラン ／ ゲーム画面</div>
<h1 style="margin:0;font-size:clamp(26px,3.6vw,38px);font-weight:700;line-height:1.2">{{ title }}</h1>
<p style="margin:0;max-width:860px;font-size:14px;line-height:1.8;text-wrap:pretty">あつまれ どうぶつの森と同じ見え方（北向きのカメラ・奥が丸く沈む地面）で、組み立て台の配置（なければ見本）と計画の地形をそのまま立体にします。島のどこにでも立てて、歩いて見て回れます。矢印キー／WASD で1マス、Shift で4マス。カメラの角度や距離の数値は目安です。<a href="London Render.dc.html">完成イメージ（俯瞰）→</a></p>
</header>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span style="font-size:12px;color:oklch(0.5 0.02 60)">地区</span>
<sc-for list="{{ dists }}" as="v" hint-placeholder-count="6"><button onClick="{{ v.pick }}" style="font:inherit;font-size:13px;border:0;border-radius:999px;padding:7px 14px;cursor:pointer;background:{{ v.bg }};color:{{ v.fg }}">{{ v.name }}</button></sc-for></div>
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center"><span style="font-size:12px;color:oklch(0.5 0.02 60)">地点</span>
<sc-for list="{{ spots }}" as="v" hint-placeholder-count="6"><button onClick="{{ v.pick }}" style="font:inherit;font-size:12px;border:1px solid oklch(0.85 0.02 85);border-radius:999px;padding:5px 11px;cursor:pointer;background:{{ v.bg }};color:{{ v.fg }}">{{ v.name }}</button></sc-for></div>
<div style="display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center">
<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:oklch(0.5 0.02 60)">カメラ</span>
<sc-for list="{{ cams }}" as="v" hint-placeholder-count="3"><button onClick="{{ v.pick }}" style="font:inherit;font-size:13px;border:1px solid oklch(0.85 0.02 85);border-radius:8px;padding:5px 10px;cursor:pointer;background:{{ v.bg }};color:{{ v.fg }}">{{ v.name }}</button></sc-for></div>
<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:oklch(0.5 0.02 60)">時間</span>
<sc-for list="{{ times }}" as="v" hint-placeholder-count="3"><button onClick="{{ v.pick }}" style="font:inherit;font-size:13px;border:1px solid oklch(0.85 0.02 85);border-radius:8px;padding:5px 10px;cursor:pointer;background:{{ v.bg }};color:{{ v.fg }}">{{ v.name }}</button></sc-for></div>
<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><span style="font-size:12px;color:oklch(0.5 0.02 60)">名前</span>
<sc-for list="{{ namesOpt }}" as="v" hint-placeholder-count="3"><button onClick="{{ v.pick }}" style="font:inherit;font-size:13px;border:1px solid oklch(0.85 0.02 85);border-radius:8px;padding:5px 10px;cursor:pointer;background:{{ v.bg }};color:{{ v.fg }}">{{ v.name }}</button></sc-for></div>
<button onClick="{{ savePng }}" style="font:inherit;font-size:13px;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;background:#a8402a;color:white">PNGで保存</button>
</div>
<div style="display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start">
<div style="flex:1 1 760px;min-width:0;display:flex;flex-direction:column;gap:8px">
<canvas ref="{{ cvRef }}" width="1280" height="720" style="width:100%;display:block;border-radius:14px;background:#7fd6c3"></canvas>
<div style="font-size:13px;color:oklch(0.35 0.02 60);font-family:'IBM Plex Mono','Zen Maru Gothic',monospace">{{ where }}</div>
<div style="font-size:12px;color:oklch(0.5 0.02 60)">{{ source }}　{{ ms }}</div>
</div>
<div style="flex:0 0 auto;display:flex;flex-direction:column;gap:8px">
<canvas ref="{{ mapRef }}" onMouseDown="{{ onMap }}" width="336" height="288" style="width:336px;height:288px;display:block;border-radius:8px;cursor:pointer;background:#7fd6c3"></canvas>
<div style="font-size:12px;color:oklch(0.5 0.02 60);max-width:336px;line-height:1.6">小地図（1マス3px）。クリックでそこへ立ちます。白い枠がおおよそ写る範囲です。地図の外へは出ません。</div>
<div style="display:grid;grid-template-columns:repeat(3,44px);gap:4px;justify-content:start">
<span></span><button onClick="{{ up }}" style="height:34px;cursor:pointer">▲</button><span></span>
<button onClick="{{ left }}" style="height:34px;cursor:pointer">◀</button><button onClick="{{ down }}" style="height:34px;cursor:pointer">▼</button><button onClick="{{ right }}" style="height:34px;cursor:pointer">▶</button>
</div>
</div>
</div>
<a href="Module Builder.dc.html">組み立て台で配置を変える →</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  cv = React.createRef();
  mp = React.createRef();
  state = { dist: 'lon', spot: 0, cam: 'normal', time: 'day', names: 'all', tx: 31, ty: 72, source: '', ms: '', ready: 0 };
  // 見る場所（地区→地点）。立つ所は計画書の地点と、実際に置いた物のそば
  SPOTS = {
    lon: ['ロンドン', [['役場前広場', 31, 70], ['時計台の前庭', 43, 69], ['テムズ川の釣り場', 38, 70], ['切り通しの運河', 52, 70], ['船だまり', 52, 79], ['飛行機ラウンジ', 44, 79], ['キングス・クロス駅', 32, 83], ['9¾番線', 30, 82], ['ハイドパーク', 22, 72], ['飛行場', 53, 82]]],
    egy: ['エジプト', [['考古学博物館', 30, 31], ['台地の池の釣り場', 21, 27], ['ナイル川と滝', 19, 40], ['ピラミッド', 21, 22], ['バザール', 20, 35], ['採石場', 31, 50]]],
    jpn: ['日本', [['神社', 56, 20], ['千本鳥居', 44, 20], ['枯れ流れ', 55, 31], ['池泉（庭の池）', 51, 54], ['石庭（枯山水）', 45, 50], ['茶屋', 48, 28]]],
    usa: ['アメリカ', [['自宅と畑', 73, 33], ['果樹園', 70, 28], ['山の湖の釣り場', 84, 36], ['三段の滝', 86, 38], ['ダウンタウン', 80, 19], ['お化けの森', 91, 21], ['国立公園キャンプ', 92, 44]]],
    eur: ['ヨーロッパ', [['パリの広場', 71, 47], ['運河の釣り場', 77, 51], ['風車の丘', 77, 68], ['花の交配畑', 85, 68], ['エイブル', 75, 72]]],
    port: ['地中海の港', [['白い崖町', 92, 77], ['桟橋（海釣り）', 107, 90], ['ビーチクラブ', 80, 80]]]
  };
  CAMS = { normal: ['ふつう', 50, 22, 1400, 30], near: ['近づく', 38, 14, 1500, 30], far: ['遠くを見る', 20, 13, 1150, 30] };
  TIMES = [['day', '昼'], ['dusk', '夕方'], ['night', '夜']];
  NAMES = [['all', '地点と地区'], ['dist', '地区だけ'], ['none', 'なし（写真）']];
  ZONES = [['hal', [[86, 0], [112, 0], [112, 25], [86, 25]]], ['usa', [[82, 25], [112, 25], [112, 46], [82, 46]]], ['usa', [[66, 0], [86, 0], [86, 25], [82, 25], [82, 46], [76, 46], [66, 40]]],
    ['egy', [[0, 0], [38, 0], [38, 30], [34, 34], [34, 52], [30, 56], [18, 56], [18, 84], [0, 84]]], ['jpn', [[38, 0], [66, 0], [66, 40], [62, 48], [62, 60], [34, 60], [34, 34], [38, 30]]],
    ['port', [[76, 72], [112, 72], [112, 96], [58, 96], [58, 84], [76, 84]]], ['eur', [[66, 40], [76, 46], [112, 46], [112, 72], [76, 72], [76, 84], [58, 84], [58, 60], [62, 60], [62, 48]]],
    ['lon', [[0, 84], [18, 84], [18, 56], [30, 56], [34, 52], [34, 60], [58, 60], [58, 96], [0, 96]]]];
  ZN = { lon: 'ロンドン', egy: 'エジプト', jpn: '日本', usa: 'アメリカ', hal: 'ハロウィン', eur: 'ヨーロッパ', port: '地中海の港' };
  zoneAt(x, y) { const px = x + .5, py = y + .5; for (const [k, p] of this.ZONES) { let ins = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, yi] = p[i], [xj, yj] = p[j]; if ((yi > py) !== (yj > py) && px < (xj - xi) * (py - yi) / (yj - yi) + xi) ins = !ins; } if (ins) return k; } return 'lon'; }
  componentDidMount() {
    fetch('plan-terrain.json').then(r => r.json()).then(j => { this.T = j; this.setState({ ready: Date.now() }); });
    fetch('samples.json').then(r => r.json()).then(j => { this.SM = j; this.setState({ ready: Date.now() }); }).catch(() => {});
    this.onKey = e => {
      if (e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
      const n = e.shiftKey ? 4 : 1, k = e.key.toLowerCase();
      const d = { arrowup: [0, -n], w: [0, -n], arrowdown: [0, n], s: [0, n], arrowleft: [-n, 0], a: [-n, 0], arrowright: [n, 0], d: [n, 0] }[k];
      if (d) { e.preventDefault(); this.move(d[0], d[1]); }
    };
    window.addEventListener('keydown', this.onKey);
    if (document.fonts) document.fonts.ready.then(() => { this.dk = null; this.draw(); });
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  componentDidUpdate() { this.draw(); }
  move(dx, dy) { this.setState(s => ({ tx: Math.max(0, Math.min(111, s.tx + dx)), ty: Math.max(0, Math.min(95, s.ty + dy)) })); }
  cell(e) { const r = this.mp.current.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * 112), Math.floor((e.clientY - r.top) / r.height * 96)]; }
  renderVals() {
    const s = this.state, chip = (cur, set) => ([k, n]) => ({ name: n, pick: () => this.setState({ [set]: k }), bg: cur === k ? '#4a3b30' : 'white', fg: cur === k ? 'white' : '#4a3b30' });
    const T = this.T;
    let where = '読み込み中…';
    if (T) { const v = (T.grid[s.ty] || '')[s.tx], l = +((T.h[s.ty] || '')[s.tx] || 0); where = `いま立っている所：${'ABCDEF'[Math.floor(s.ty / 16)]}${Math.floor(s.tx / 16) + 1}（x${s.tx}, y${s.ty}）・${this.ZN[this.zoneAt(s.tx, s.ty)]}・${l}段目・${{ S: '海', s: '砂浜', r: '岩場', w: '川・池', p: '道・広場', P: '案内所前の広場', b: '橋', K: 'レンガ（9¾）', t: '林' }[v] || '草地'}`; }
    return {
      title: (this.SPOTS[s.dist] ? this.SPOTS[s.dist][1][s.spot] || this.SPOTS[s.dist][1][0] : this.SPOTS.lon[1][0])[0] + 'のゲーム画面',
      cvRef: this.cv, mapRef: this.mp, where, source: s.source, ms: s.ms,
      dists: Object.entries(this.SPOTS).map(([k, v]) => ({ name: v[0], pick: () => this.setState({ dist: k, spot: 0, tx: v[1][0][1], ty: v[1][0][2] }), bg: s.dist === k ? '#4a3b30' : 'white', fg: s.dist === k ? 'white' : '#4a3b30' })),
      spots: this.SPOTS[s.dist][1].map(([n, x, y], i) => ({ name: n, pick: () => this.setState({ spot: i, tx: x, ty: y }), bg: s.spot === i && s.tx === x && s.ty === y ? '#a8402a' : 'white', fg: s.spot === i && s.tx === x && s.ty === y ? 'white' : '#4a3b30' })),
      cams: Object.entries(this.CAMS).map(([k, v]) => chip(s.cam, 'cam')([k, v[0]])), times: this.TIMES.map(chip(s.time, 'time')), namesOpt: this.NAMES.map(chip(s.names, 'names')),
      onMap: e => { const [x, y] = this.cell(e); this.setState({ tx: Math.max(0, Math.min(111, x)), ty: Math.max(0, Math.min(95, y)) }); },
      up: () => this.move(0, -1), down: () => this.move(0, 1), left: () => this.move(-1, 0), right: () => this.move(1, 0),
      savePng: () => { const c = this.cv.current; if (!c) return; c.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = `アイス島_ゲーム画面_x${s.tx}_y${s.ty}_${s.time}.png`; a.click(); }); }
    };
  }
  rot(r, n) { let a = r.map(s => s.split('')); for (let i = 0; i < n; i++) { const h = a.length, w = a[0].length, o = []; for (let y = 0; y < w; y++) { o.push([]); for (let x = 0; x < h; x++) o[y].push(a[h - 1 - x][y]); } a = o; } return a; }
  loadPlacement() {
    let placed = null, paint = {}, defs = {}, src = '';
    try { const s = JSON.parse(localStorage.getItem('wti-module-board') || 'null'); if (s && ((s.placed || []).length || Object.keys(s.paint || {}).length)) { placed = (s.placed || []).map(p => [p.m, p.x, p.y, p.rot || 0]); paint = s.paint || {}; defs = s.defs || {}; src = '組み立て台の配置で描画中'; } } catch (e) {}
    const SM = this.SM;
    if (SM) { defs = Object.assign({}, SM.defs, defs); if (!placed) { placed = Object.values(SM.dists).flat(); paint = {}; Object.values(SM.paint).forEach(p => Object.assign(paint, p)); src = '見本の配置で描画中'; } }
    return { placed: placed || [], paint, defs, src: src || '配置を読み込み中…' };
  }
  // 配置を読み直すのは、配置が読み込みで変わったときだけ
  placement() {
    const P = this.loadPlacement(), k = P.src + '|' + P.placed.length + '|' + Object.keys(P.paint).length;
    if (this.pk === k && this.PL) return this.PL;
    this.pk = k;
    const fur = {}, gnd = {}, blds = [], mills = [], mons = [];
    const GC = { B: '#b8694b', p: '#cdbb91', S: '#ead39b', g: '#dedbd2', d: '#c9a074', m: '#f7f5ef', r: '#6f9e4f' };
    P.placed.forEach(([id, px, py, r]) => {
      const rows = P.defs[id]; if (!rows) return; const a = this.rot(rows, r || 0);
      let hb = null, ms = null, ss = [], door = null;
      a.forEach((row, dy) => row.forEach((ch, dx) => { if (ch === '.') return; const x = px + dx, y = py + dy;
        if (ch === 'H') { hb = hb || { x1: 1e9, y1: 1e9, x2: -1, y2: -1 }; hb.x1 = Math.min(hb.x1, x); hb.y1 = Math.min(hb.y1, y); hb.x2 = Math.max(hb.x2, x); hb.y2 = Math.max(hb.y2, y); }
        else if (ch === 'M') { ms = ms || { x1: 1e9, y1: 1e9, x2: -1, y2: -1 }; ms.x1 = Math.min(ms.x1, x); ms.y1 = Math.min(ms.y1, y); ms.x2 = Math.max(ms.x2, x); ms.y2 = Math.max(ms.y2, y); }
        else if (ch === 's') ss.push([x, y]);
        else if (ch === 'D') door = [x, y];
        else if (ch === 'l') { }   // 空けるマス（木・岩・花のまわり）は草地のまま
        else if (GC[ch]) { if (!gnd[x + ',' + y]) gnd[x + ',' + y] = ch; }
        else if (ch === 'w' || ch === '=' || ch === 'Z') { }
        else fur[x + ',' + y] = ch; }));
      if (hb) blds.push({ x: hb.x1, y: hb.y1, w: hb.x2 - hb.x1 + 1, d: hb.y2 - hb.y1 + 1, id, door });
      if (ms) mills.push({ x: ms.x1, y: ms.y1, w: ms.x2 - ms.x1 + 1, d: ms.y2 - ms.y1 + 1 });
      if (ss.length >= 6) { const xs = ss.map(p => p[0]), ys = ss.map(p => p[1]); mons.push({ x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs) + 1, d: Math.max(...ys) - Math.min(...ys) + 1 }); }
      else ss.forEach(([x, y]) => { fur[x + ',' + y] = 's'; });
    });
    blds.push({ x: 28, y: 63, w: 6, d: 4, id: '_info' }); blds.push({ x: 44, y: 85, w: 8, d: 5, id: '_airport' });
    const roads = {};
    Object.entries(P.paint).forEach(([k, v]) => { if (v.startsWith('r:')) roads[k] = v; else gnd[k] = v; });   // 白砂（砂紋）などは地面
    this.PL = { fur, gnd, blds, mills, mons, paint: roads, src: P.src };
    return this.PL;
  }
  draw() {
    const T = this.T, c = this.cv.current; if (!T || !c) return;
    const s = this.state, PL = this.placement();
    const key = [s.tx, s.ty, s.cam, s.time, s.names, PL.src, Object.keys(PL.paint).length, PL.blds.length].join('|');
    if (this.dk === key) return; this.dk = key;
    const t0 = performance.now();
    if (s.source !== PL.src) this.setState({ source: PL.src });
    this.render(c, T, PL, s);
    this.drawMap(T, PL, s);
    const ms = Math.round(performance.now() - t0) + 'ミリ秒で描画';
    if (this.state.ms !== ms) setTimeout(() => this.setState({ ms }), 0);
  }
  drawMap(T, PL, s) {
    const m = this.mp.current; if (!m) return; const ctx = m.getContext('2d'), S = 3;
    const C = { S: '#7fd6c3', s: '#f0e4a4', r: '#7c7f94', w: '#8ee0d0', '1': '#4c9f48', '3': '#72c752', t: '#3c843a', p: '#c8b487', b: '#8d8a92', P: '#cdb88c', K: '#b8694b' };
    for (let y = 0; y < 96; y++) for (let x = 0; x < 112; x++) { const l = +T.h[y][x]; ctx.fillStyle = C[T.grid[y][x]] || '#4c9f48'; ctx.fillRect(x * S, y * S, S, S); if (l >= 2 && T.grid[y][x] !== 'w') { ctx.fillStyle = `rgba(0,0,0,${l === 2 ? .12 : .24})`; ctx.fillRect(x * S, y * S, S, S); } }
    Object.keys(PL.paint).forEach(k => { const [x, y] = k.split(',').map(Number); ctx.fillStyle = '#5f5a57'; ctx.fillRect(x * S, y * S, S, S); });
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.5; ctx.strokeRect((s.tx - 9) * S, (s.ty - 12) * S, 19 * S, 14 * S);
    ctx.fillStyle = '#d9483b'; ctx.beginPath(); ctx.arc((s.tx + .5) * S, (s.ty + .5) * S, 3.2, 0, 7); ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  }
  render(c, T, PL, s) {
    const W = 1280, H = 720, ctx = c.getContext('2d'), G = T.grid, HL = T.h;
    const [, ANG, DIST, FOC, R] = this.CAMS[s.cam], a = ANG * Math.PI / 180;
    const at = (x, y) => (G[y] || '')[x], lvl = (x, y) => +((HL[y] || '')[x] || 0);
    const LZ = l => (Math.max(l, 1) - 1) * 1.1;
    const topz = (x, y) => { const v = at(x, y), l = lvl(x, y); if (v === undefined || v === 'S') return -.62; if (v === 'w') return LZ(l) - .5; if (v === 's') return -.16; if (v === 'r') return -.3; return LZ(l); };
    // 坂のマスの四隅の高さ
    if (!this.slopeMap) {
      const sm = {};
      (T.inclines || []).forEach(([sx, sy, d]) => { const hi = lvl(sx, sy), z1 = LZ(hi), z0 = LZ(hi - 1);
        for (let i = 0; i < 4; i++) for (let k = 0; k < 2; k++) { const x = d === 'E' || d === 'W' ? sx + i : sx + k, y = d === 'E' || d === 'W' ? sy + k : sy + i, f = d === 'S' || d === 'E' ? i : 3 - i;
          const zs = t => z1 + (z0 - z1) * Math.max(0, Math.min(1, t / 3)); const p = zs(f), q = zs(f + 1); let nw, ne, se, sw;
          if (d === 'S') { nw = ne = p; sw = se = q; } else if (d === 'N') { nw = ne = q; sw = se = p; } else if (d === 'E') { nw = sw = p; ne = se = q; } else { nw = sw = q; ne = se = p; }
          sm[x + ',' + y] = [nw, ne, se, sw]; } });
      this.slopeMap = sm;
    }
    const slope = this.slopeMap;
    const corners = (x, y) => slope[x + ',' + y] || (z => [z, z, z, z])(topz(x, y));
    const tx = s.tx + .5, ty = s.ty + .5, z0 = topz(s.tx, s.ty) + .0;
    // ---- 投影（奥が丸く沈む） ----
