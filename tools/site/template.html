<style>
/* Layout: 左に島の地図（いつも見える）、右に選んだモジュールの作業台。スマホでは縦に重ねる */
:root {
  --bg: #eef3f1; --panel: #fbfcfa; --ink: #22302d; --muted: #5f706b; --line: #d5dfdb;
  --sea: #6fc6cf; --accent: #b4503a; --accent-ink: #ffffff; --ok: #3d7d4f; --warn: #b9772a; --chip: #e3ebe8;
  --display: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
  --body: 'Zen Kaku Gothic New', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #141b1a; --panel: #1c2624; --ink: #e5ece9; --muted: #9db0aa; --line: #2f3d3a; --sea: #2f7c86; --accent: #e07a5f; --accent-ink: #1a1210; --ok: #6fbf84; --warn: #e2a65a; --chip: #26332f; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #141b1a; --panel: #1c2624; --ink: #e5ece9; --muted: #9db0aa; --line: #2f3d3a; --sea: #2f7c86; --accent: #e07a5f; --accent-ink: #1a1210; --ok: #6fbf84; --warn: #e2a65a; --chip: #26332f; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.65 }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 60px; display: flex; flex-direction: column; gap: 16px }
header { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-end; justify-content: space-between }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3.4vw, 34px); margin: 0; line-height: 1.15; text-wrap: balance }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--muted) }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted) }
.stats b { font-family: var(--display); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 2px }
nav { display: flex; gap: 6px; flex-wrap: wrap }
button { font: inherit; cursor: pointer; color: inherit }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-weight: 700 }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start }
@media (max-width: 980px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px) }
@media (max-width: 980px) { .sticky { position: static } }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.muted { color: var(--muted); font-size: 12.5px }
h2 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0; line-height: 1.25; text-wrap: balance }
h3 { font-family: var(--display); font-weight: 800; font-size: 16px; margin: 0 }
canvas { display: block; width: 100%; border-radius: 10px }
#map { touch-action: manipulation; cursor: pointer; background: var(--sea) }
.ma { font-family: var(--mono); font-size: 12.5px; color: var(--accent); white-space: nowrap }
.pill { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px; background: var(--chip) }
.pill.lm { background: #f2c14e; color: #3a2d10 }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px }
@media (max-width: 640px) { .two { grid-template-columns: minmax(0, 1fr) } }
.ref img { width: 100%; border-radius: 10px; display: block; border: 1px solid var(--line) }
.ref figcaption { font-size: 12px; color: var(--muted); margin-top: 4px }
.list { display: flex; flex-direction: column; gap: 6px; max-height: 520px; overflow-y: auto }
.item { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 10px; width: 100% }
.item[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset }
.item .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 13px }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none }
.step { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 10px }
.step-h { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.done { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12px; background: var(--panel) }
.done[aria-pressed="true"] { background: var(--ok); color: var(--bg); border-color: var(--ok) }
.dz { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: start }
.dz img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line) }
.parts { display: flex; gap: 4px; flex-wrap: wrap }
.parts span { font-size: 11.5px; background: var(--chip); border-radius: 999px; padding: 1px 8px }
.badge { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px }
.mk { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--bg); flex: none }
.layers { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 6px 10px; font-size: 13px }
.band { border-radius: 6px; padding: 0 8px; font-weight: 700; text-align: center; color: #23302c }
ol.fix { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px }
.no { font-family: var(--mono); font-size: 11.5px; font-weight: 700; background: var(--ink); color: var(--bg); border-radius: 5px; padding: 0 6px }
.pill.ok { background: var(--ok); color: var(--bg) }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.opt { display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px; font-size: 12.5px }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset }
.opt img, .opt .noimg { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: grid; place-items: center; background: var(--chip) }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px }
#refs { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
#refs .card img { aspect-ratio: 1 / 1 }
#refs .b { padding: 6px 8px; gap: 2px; font-size: 11.5px }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column }
.card img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block }
.card .b { padding: 10px 12px; display: flex; flex-direction: column; gap: 5px }
input[type="search"] { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); min-width: 0; flex: 1 }
.hint { font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-height: 18px }
.copy { border: 0; border-radius: 999px; padding: 6px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 700 }
.legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted) }
.legend span { display: inline-flex; gap: 4px; align-items: center }
a { color: var(--accent) }
@media (prefers-reduced-motion: no-preference) { .item, .tab, .chip { transition: background .15s, border-color .15s } }
</style>

<script>
(() => {
const D = JSON.parse(document.getElementById('data').textContent);
const DT = window.DesignTiles;
const $ = id => document.getElementById(id);
const TH = D.th, THC = D.thColor, LEG = D.leg, LON = D.lon, CAT = D.cat;
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const S = { choice: store.get('ice-choice', {}), isoView: 'lon', tab: 'map', zoom: 'lon', theme: 'lon', q: '', sel: 'lon_d_platform', hover: null, done: store.get('ice-done', {}), bookTh: 'lon' };
const IMG = {}; const img = src => { if (!src) return null; if (!IMG[src]) { const i = new Image(); i.onload = () => { i.ok = true; redraw(); }; i.src = src; IMG[src] = i; } return IMG[src].ok ? IMG[src] : null; };
let redrawQ = false; const redraw = () => { if (redrawQ) return; redrawQ = true; requestAnimationFrame(() => { redrawQ = false; drawMap(); drawSketch(); }); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const where = (x, y) => 'ABCDEF'[Math.floor(y / 16)] + (Math.floor(x / 16) + 1);
const isLon = m => m.th === 'ロンドン';
const docOf = m => ({ ...LON, items: { ...LON.items, ...(m.itemsOv || {}) } }), texOf = (m, ch) => (m.texOv || {})[ch] || LON.texItems[ch];
const chosen = p => (p.slot && (S.choice[p.slot] || (D.options[p.slot] || {}).default)) || p.id;
const mods = () => D.places.map(p => ({ ...D.mods[chosen(p)], ...p, id: chosen(p), rows: p.slot ? D.mods[chosen(p)].r : p.rows, size: p.rows.join('').replace(/\./g, '').length }));

// ---------- 地図 ----------
const TC = { S: '#5fbfca', s: '#ecdcaa', r: '#8b8697', w: '#86d8d6', b: '#a58f78', p: '#d6c595', P: '#dcc996', K: '#b8694b', t: '#3d8645', '1': '#6cb355', '3': '#86c862' };
const ZB = { all: [0, 0, 112, 96], lon: [14, 50, 66, 96], egy: [0, 0, 40, 60], jpn: [34, 0, 68, 62], usa: [64, 0, 112, 48], eur: [56, 40, 112, 86], port: [56, 70, 112, 96] };
function mapView() { const c = $('map'), b = ZB[S.zoom]; return { c, b, k: c.width / (b[2] - b[0]) }; }
// 立体図（London Render と同じ投影）。モジュールの中心を画面の位置に直して、クリックで選べるようにする
const RV = { lon: [16, 52, 65, 94], egy: [8, 12, 40, 62], jpn: [32, 12, 67, 61], usa: [65, 12, 101, 47], eur: [57, 39, 101, 85], port: [64, 70, 112, 94], all: [0, 4, 112, 96] };
function isoProj(v) { const [bx0, by0, bx1, by1] = RV[v], nx = bx1 - bx0, ny = by1 - by0, TW = nx + ny > 120 ? 12 : 16, TH = TW / 2, HZ = TW * .45, ZL = [0, 2, 6, 10], ox = ny * TW + 60, oy = 10 * HZ + 70;
  return { TW, b: RV[v], P: (x, y) => { const h = +((D.h[Math.floor(y)] || '')[Math.floor(x)] || 0); return [ox + (x - bx0 - (y - by0)) * TW, oy + (x - bx0 + y - by0) * TH - ZL[h] * HZ]; } }; }
function drawIso() { const v = S.isoView, V = D.views[v], c = $('iso'); if (!V) { $('isoPanel').hidden = true; return; } const im = img(V.img); c.width = V.w; c.height = V.h; const x = c.getContext('2d');
  if (im) x.drawImage(im, 0, 0); const { P, TW, b } = isoProj(v);
  const m = mods().find(m => m.id === S.sel && m.x === S.selX && m.y === S.selY);
  if (m) { const [sx, sy] = P(m.x + m.rows[0].length / 2, m.y + m.rows.length / 2); x.strokeStyle = '#ffffff'; x.lineWidth = 4; x.beginPath(); x.ellipse(sx, sy, Math.max(30, m.rows[0].length * TW * .9), Math.max(16, m.rows[0].length * TW * .45), 0, 0, 7); x.stroke(); x.strokeStyle = '#b4503a'; x.lineWidth = 2; x.stroke();
    x.font = '800 22px ' + getComputedStyle(document.body).getPropertyValue('--display'); const t = m.short || m.name, tw = x.measureText(t).width; x.fillStyle = '#b4503a'; x.fillRect(sx - tw / 2 - 10, sy - 70, tw + 20, 32); x.fillStyle = '#fff'; x.textAlign = 'center'; x.fillText(t, sx, sy - 46); x.textAlign = 'left'; } }
function hitIso(e) { const v = S.isoView, c = $('iso'), r = c.getBoundingClientRect(), sx = (e.clientX - r.left) / r.width * c.width, sy = (e.clientY - r.top) / r.height * c.height, { P, TW, b } = isoProj(v);
  let best = null, bd = 1e9; mods().forEach(m => { if (m.size < 6) return; const cx = m.x + m.rows[0].length / 2, cy = m.y + m.rows.length / 2; if (cx < b[0] || cx > b[2] || cy < b[1] || cy > b[3]) return; const [px, py] = P(cx, cy), d = Math.hypot(px - sx, (py - sy) * 1.6); if (d < bd) { bd = d; best = m; } });
  return bd < TW * 5 ? best : null; }
function drawMap() { drawIso();
  const { c, b, k } = mapView(); c.height = Math.round((b[3] - b[1]) * k); const x = c.getContext('2d');
  x.fillStyle = TC.S; x.fillRect(0, 0, c.width, c.height);
  for (let y = b[1]; y < b[3]; y++) for (let X = b[0]; X < b[2]; X++) { const ch = D.grid[y][X], h = +D.h[y][X];
    let col = TC[ch] || '#6cb355'; x.fillStyle = col; x.fillRect((X - b[0]) * k, (y - b[1]) * k, k + .5, k + .5);
    if (h >= 2 && '13tpPK'.includes(ch)) { x.fillStyle = `rgba(255,255,255,${h === 2 ? .12 : .24})`; x.fillRect((X - b[0]) * k, (y - b[1]) * k, k + .5, k + .5); }
    const hs = +(D.h[y + 1] || '')[X]; if (hs < h && '13tpPKb'.includes(ch)) { x.fillStyle = 'rgba(60,40,30,.45)'; x.fillRect((X - b[0]) * k, (y - b[1] + 1) * k - k * .28, k, k * .28); } }
  Object.values(D.paint).forEach(pa => Object.entries(pa).forEach(([kk, v]) => { const [X, y] = kk.split(',').map(Number); if (X < b[0] || X >= b[2] || y < b[1] || y >= b[3]) return; x.fillStyle = v.startsWith('r:') ? 'rgba(70,64,62,.55)' : 'rgba(245,240,230,.7)'; x.fillRect((X - b[0]) * k, (y - b[1]) * k, k + .5, k + .5); }));
  mods().forEach(m => { const W = m.rows[0].length, H = m.rows.length, px = (m.x - b[0]) * k, py = (m.y - b[1]) * k;
    if (m.x + W < b[0] || m.x > b[2] || m.y + H < b[1] || m.y > b[3]) return;
    if (m.size < 6 && !(m.id === S.sel && m.x === S.selX)) return;   // 小物・すき間うめは地図に描かない（一覧からは選べる）
    const sel = m.id === S.sel && m.x === S.selX && m.y === S.selY, col = THC[m.zone] || '#888';
    x.fillStyle = col + (sel ? 'ee' : m.role === 'landmark' || m.detail ? 'b0' : '60'); m.rows.forEach((row, dy) => [...row].forEach((ch, dx) => { if (ch !== '.') x.fillRect(px + dx * k, py + dy * k, k + .5, k + .5); }));   // 空きマス（.）は塗らない
    if (sel) { x.lineWidth = 3; x.strokeStyle = '#fff'; x.strokeRect(px + .5, py + .5, W * k - 1, H * k - 1); }
    if (m.detail) { x.fillStyle = '#fff'; x.beginPath(); x.arc(px + W * k - 5, py + 5, 4, 0, 7); x.fill(); }
    if ((m.role === 'landmark' && S.zoom !== 'all') || sel) { x.font = `800 ${Math.max(10, Math.min(14, k * 1.1))}px ${getComputedStyle(document.body).getPropertyValue('--display')}`; const t = (m.short || m.name); const tw = x.measureText(t).width;
      x.fillStyle = 'rgba(255,255,255,.92)'; x.fillRect(px, py - 17, tw + 10, 16); x.fillStyle = '#22302d'; x.fillText(t, px + 5, py - 5); } });
  D.facs.forEach(([nm, kind, fx, fy]) => { if (fx < b[0] || fx >= b[2] || fy < b[1] || fy >= b[3]) return; x.fillStyle = '#ffffff'; x.beginPath(); x.arc((fx - b[0] + .5) * k, (fy - b[1] + .5) * k, Math.max(4, k * .45), 0, 7); x.fill(); x.fillStyle = '#22302d'; x.font = `700 ${Math.max(8, k * .6)}px sans-serif`; x.textAlign = 'center'; x.fillText(D.facGlyph[kind] || '・', (fx - b[0] + .5) * k, (fy - b[1] + .5) * k + k * .22); x.textAlign = 'left'; });
}
function hitMap(e) { const { c, b, k } = mapView(), r = c.getBoundingClientRect(); const X = (e.clientX - r.left) / r.width * c.width / k + b[0], Y = (e.clientY - r.top) / r.height * c.height / k + b[1];
  const hits = mods().filter(m => X >= m.x && X < m.x + m.rows[0].length && Y >= m.y && Y < m.y + m.rows.length); return { hit: hits.sort((a, b2) => a.rows.length * a.rows[0].length - b2.rows.length * b2.rows[0].length)[0], X: Math.floor(X), Y: Math.floor(Y) }; }
$('map').addEventListener('click', e => { const { hit } = hitMap(e); if (hit) select(hit.id, hit.x, hit.y); });
$('iso').addEventListener('click', e => { const hit = hitIso(e); if (hit) { select(hit.id, hit.x, hit.y, true); } });
$('iso').addEventListener('mousemove', e => { const h = hitIso(e); $('isoHint').textContent = h ? `${h.name}（${TH[h.zone] || ''}・${where(h.x, h.y)}）をクリックで開く` : '立体図の建物や広場をクリックすると、下にそのモジュールを開きます'; });

  ${lon ? `<div class="step"><div class="step-h"><h3>① 地面を敷く（マイデザインの道）</h3>${stepBtn('g')}</div>${ground.length ? ground.map(u => dzRow({ ...u, partsHtml: `<div class="parts">${Object.entries(u.parts).map(([k, n]) => `<span>${esc(k)} <b>${n}</b>マス</span>`).join('')}</div>` })).join('') : '<span class="muted">道は敷かない（草地のまま）</span>'}</div>
  <div class="step"><div class="step-h"><h3>② マイデザインを貼る家具</h3>${stepBtn('d')}</div>${dzItems.join('') || '<span class="muted">なし</span>'}</div>` : ''}
  <div class="step"><div class="step-h"><h3>${lon ? '③' : ''} 家具を置く</h3>${stepBtn('p')}</div>${plain.join('') || '<span class="muted">なし</span>'}</div>`;
  if (!lon) { /* ①②がない地区は家具だけで済み */ }
  $('ovBtn').onclick = () => { S.overlay = !S.overlay; renderDetail(); };
  const sk = $('sketch');
  sk.onmousemove = e => { const r = sk.getBoundingClientRect(), X = Math.floor((e.clientX - r.left) / r.width * W), y = Math.floor((e.clientY - r.top) / r.height * H); if (X < 0 || y < 0 || X >= W || y >= H) return;
    if (!S.hover || S.hover[0] !== X || S.hover[1] !== y) { S.hover = [X, y]; drawSketch(); const t = lon && DT.tilePieces(m.r, LON.ground, m.under)[y][X], ch = m.r[y][X], parts = [];
      if (t) parts.push(`${t.slot}「${t.piece}」${t.sides ? '（' + t.sides + 'に縁）' : ''} ${(CAT[t.design] || {}).ma || ''}`); if (ch in N) parts.push('家具：' + fname(m, ch)); if (!parts.length) parts.push(ch === '.' ? '草地' : (LEG[ch] || [ch])[0]);
      $('cellHint').textContent = `奥から${y + 1}列目・左から${X + 1}番目　` + parts.join('　'); } };
  sk.onmouseleave = () => { S.hover = null; drawSketch(); };
  drawSketch();
}

// ---------- 建てる準備・図鑑 ----------
function lonAll() { return mods().filter(p => p.zone === 'lon'); }
function prepData() { const all = lonAll(), dz = new Map(), g = new Set(), it = new Set();
  all.forEach(m => { DT.designsUsed(m.r, docOf(m), m.under).forEach(u => { if (!dz.has(u.design)) dz.set(u.design, new Set()); dz.get(u.design).add(u.slot); });
    DT.tilePieces(m.r, LON.ground, m.under).flat().forEach(t => { if (t) g.add(t.design + t.piece); });
    m.r.forEach((r, y) => [...r].forEach((ch, X) => { const tx = texOf(m, ch); if (tx) it.add(pieceOf(m, ch, X, y, tx)); else if (docOf(m).items[ch]) it.add(ch); })); });
  return { all, dz, slots: g.size + it.size, g: g.size, it: it.size }; }
function renderStats() { const P = prepData(), mods2 = D.places.length; const done = Object.keys(S.done).filter(allDone).length;
  $('stats').innerHTML = `<span><b>${mods2}</b>モジュール（島全体）</span><span><b>${done}</b>でき上がり</span><span><b>${P.dz.size}</b>ロンドンで使うマイデザイン</span><span><b>${P.slots}</b>保存する枠（ロンドン）</span>`; }
function renderPrep() { const P = prepData();
  $('tab-prep').innerHTML = `<h2>ロンドンを建てる準備</h2>
  <p style="margin:0;max-width:72ch">エイブルシスターズの端末へ行くのは1回にまとめます。下の作者IDを順に入れて、使うパーツだけを保存します（道のパーツは1つで1枠）。保存の枠には限りがあるので、地区ごとに入れかえます。家具は「地図とモジュール」で1つずつ「済みにする」と、ここの数が進みます。</p>
  <div class="row"><button class="copy" data-copy="1">作者IDの一覧をコピー</button><span class="muted" id="copyMsg">${P.dz.size} 件・保存する枠 ${P.slots}（地面のパーツ ${P.g}・家具に貼る図 ${P.it}）</span></div>
  <textarea id="copyText" readonly style="width:100%;min-height:90px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);padding:8px" aria-label="作者IDの一覧">${esc(copyText(P))}</textarea>
  <div class="book">${[...P.dz].map(([id, slots]) => { const d = CAT[id] || {}; return `<div class="card"><a href="${esc((d.images || [])[0] || d.search)}" target="_blank" rel="noopener"><img src="${d.thumb || ''}" alt="${esc(d.name)}"></a><div class="b"><span class="ma">${esc(d.ma)}</span><b>${esc((d.name || '').replace(/（.*$/, ''))}</b><span class="muted">${esc(d.creator)}</span><span style="font-size:12.5px">使う所：${esc([...slots].join('・'))}</span></div></div>`; }).join('')}</div>
  <h3>ロンドンのモジュールの進み具合</h3>
  <div class="list" style="max-height:none">${P.all.map(m => { const d = S.done[m.id] || {}; return `<button class="item" data-id="${m.id}" data-x="${m.x}" data-y="${m.y}"><i class="dot" style="background:${allDone(m.id) ? 'var(--ok)' : 'var(--line)'}"></i><span class="nm">${esc(m.name)}</span><span class="muted">${['g', 'd', 'p'].map(k => d[k] ? '●' : '○').join('')}</span><span class="muted">${where(m.x, m.y)}</span></button>`; }).join('')}</div>`;
  document.querySelectorAll('#tab-prep .item').forEach(b => b.addEventListener('click', () => { S.tab = 'map'; document.querySelector('.tab[data-tab="map"]').click(); }, { once: true })); }
function copyText(P) { return ['アイス島・ロンドンで使うマイデザイン（作者IDで探す）', ...[...P.dz].map(([id, s]) => { const d = CAT[id] || {}; return `${d.ma}\t${[...s].join('・')}\t${(d.name || '').replace(/（.*$/, '')}\t${d.creator || ''}`; })].join('\n'); }
function copyList(btn) { const t = $('copyText'), txt = t.value; const ok = () => { $('copyMsg').textContent = 'コピーしました'; }; const fb = () => { t.focus(); t.select(); $('copyMsg').textContent = '選択しました。コピーしてください'; };
  try { navigator.clipboard.writeText(txt).then(ok, fb); } catch (e) { fb(); } }
function renderBook() { $('bookChips').innerHTML = [['lon', 'ロンドン'], ['eur', 'ヨーロッパ'], ['usa', 'アメリカ'], ['port', '地中海']].map(([k, n]) => `<button class="chip" data-book="${k}" aria-pressed="${S.bookTh === k}">${n}</button>`).join('');
  const use = {}; if (LON) [...Object.values(LON.ground), ...Object.values(LON.items)].forEach(g => { (use[g.design] = use[g.design] || new Set()).add(g.slot); });
  $('book').innerHTML = Object.values(CAT).filter(d => d.themes.includes(S.bookTh)).map(d => `<div class="card"><a href="${esc(d.images[0])}" target="_blank" rel="noopener"><img src="${d.thumb}" alt="${esc(d.name)}" loading="lazy"></a><div class="b"><div class="row" style="gap:6px"><span class="no">${esc(d.no)}</span>${d.verdict ? `<span class="pill ok">${esc(d.verdict)}</span>` : ''}</div><b>${esc(d.name)}</b>${d.use ? `<span style="font-size:12px;color:var(--ok)">用途：${esc(d.use)}</span>` : ''}<div class="row" style="gap:6px"><span class="ma">${esc(d.ma)}</span>${d.checked === false ? '<span class="pill" style="color:var(--warn)">要確認</span>' : ''}<span class="muted">${esc(d.creator)}</span></div><span style="font-size:12.5px;color:var(--muted)">${esc(d.look)}</span><div class="parts">${d.parts.map(p => `<span>${esc(p)}</span>`).join('')}</div>${use[d.id] && S.bookTh === 'lon' ? `<span style="font-size:12px;color:var(--ok)">ロンドンで使う：${esc([...use[d.id]].join('・'))}</span>` : ''}<span class="muted"><a href="${esc(d.search)}" target="_blank" rel="noopener">Pinterest で探す</a></span></div></div>`).join(''); }

function renderRefs() { S.refTh = S.refTh || 'all'; S.refQ = S.refQ || 'all'; S.refMa = !!S.refMa;
  const byTh = D.refs.filter(r => S.refTh === 'all' || r.th === S.refTh), qs = [...new Set(byTh.map(r => r.q))]; if (S.refQ !== 'all' && !qs.includes(S.refQ)) S.refQ = 'all';
  const TN = { all: 'すべての地区', ...TH, hal: 'ハロウィン', all2: '' };
  $('refChips').innerHTML = `<div class="row">${['all', 'lon', 'egy', 'jpn', 'usa', 'hal', 'eur', 'port'].map(k => `<button class="chip" data-refth="${k}" aria-pressed="${S.refTh === k}">${esc(k === 'all' ? `すべて（${D.refs.length}）` : `${TN[k]}（${D.refs.filter(r => r.th === k).length}）`)}</button>`).join('')}<button class="chip" data-refok="1" aria-pressed="${!!S.refOk}">採用だけ（${D.refs.filter(r => r.verdict).length}）</button><button class="chip" data-refma="1" aria-pressed="${S.refMa}">作者IDがある図だけ（${D.refs.filter(r => r.ma).length}）</button></div>
    <div class="row"><label class="muted" for="refQsel">検索語</label><select id="refQsel" style="font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%">${[['all', 'すべて'], ...qs.map(q => [q, q])].map(([k, n]) => `<option value="${esc(k)}"${S.refQ === k ? ' selected' : ''}>${esc(n)}（${k === 'all' ? byTh.length : byTh.filter(r => r.q === k).length}）</option>`).join('')}</select></div>`;
  $('refQsel').onchange = e => { S.refQ = e.target.value; renderRefs(); };
  const kw = (S.refKw || '').trim().toUpperCase(); $('refs').innerHTML = byTh.filter(r => (S.refQ === 'all' || r.q === S.refQ) && (!S.refMa || r.ma) && (!S.refOk || r.verdict) && (!kw || (r.no + ' ' + (r.ma || '') + ' ' + r.q + ' ' + (r.use || '') + ' ' + (r.note || '')).toUpperCase().includes(kw))).map(r => `<div class="card"><a href="${esc(r.url)}" target="_blank" rel="noopener"><img src="${r.thumb}" alt="" loading="lazy"></a><div class="b"><div class="row" style="gap:5px"><span class="no">${esc(r.no)}</span>${r.verdict ? `<span class="pill ok">${esc(r.verdict)}</span>` : ''}</div>${r.note ? `<span style="font-size:11.5px;color:var(--ok)">${esc(r.note)}</span>` : ''}<span class="muted">検索：${esc(r.q)}</span>${r.ma ? `<span class="ma" style="white-space:normal">${esc(r.ma)}</span>${r.ocr ? '<span class="muted">画像から自動で読んだ作者ID（要確認）</span>' : ''}` : ''}${r.use ? `<span style="font-size:12px;color:var(--ok)">使っている所：${esc(r.use)}</span>` : ''}</div></div>`).join(''); }
$('refKw').addEventListener('input', e => { S.refKw = e.target.value; renderRefs(); });
document.addEventListener('click', e => { const t = e.target.closest('[data-refq],[data-refth],[data-refma],[data-refok]'); if (!t) return; if (t.dataset.refq) S.refQ = t.dataset.refq; if (t.dataset.refth) S.refTh = t.dataset.refth; if (t.dataset.refma) S.refMa = !S.refMa; if (t.dataset.refok) S.refOk = !S.refOk; renderRefs(); });
renderStats(); renderLists(); select(S.sel); window.addEventListener('resize', () => drawMap());
})();
</script>
