<title>アイス島ビルドガイド</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: 左に島の地図（いつも見える）、右に選んだモジュールの作業台。スマホでは縦に重ねる */
:root {
  /* あつ森のメニュー画面：クリーム色の紙・こげ茶の文字・選んだ所は黄色・葉っぱの緑 */
  --bg: #f6f0dc; --dot: #ece2c2; --panel: #fffbec; --ink: #6b5536; --muted: #9a8665; --line: #e6dab8; --shade: #e3d4a8;

  --sel: #f6d34a; --sel-dk: #d9b02a; --sel-ink: #5a4421; --leaf: #6cbf55;
  --display: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic', sans-serif;
  --body: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Yu Gothic', 'Noto Sans JP', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1e2a3d; --dot: #2a3a52; --panel: #283850; --ink: #f4ecd4; --muted: #bdb294; --line: #3c4f6b; --shade: #17202e; --sea: #2f7c86; --accent: #ef8a6a; --accent-ink: #1a1210; --ok: #7fcf86; --top: #c3a3f0; --mid: #e3bf5e; --warn: #e9ad62; --chip: #324560; --sel: #f2cf4a; --sel-dk: #b8962a; --sel-ink: #3a2b10; --leaf: #8fd879; color-scheme: dark } }
:root[data-theme="dark"] { --bg: #1e2a3d; --dot: #2a3a52; --panel: #283850; --ink: #f4ecd4; --muted: #bdb294; --line: #3c4f6b; --shade: #17202e; --sea: #2f7c86; --accent: #ef8a6a; --accent-ink: #1a1210; --ok: #7fcf86; --top: #c3a3f0; --mid: #e3bf5e; --warn: #e9ad62; --chip: #324560; --sel: #f2cf4a; --sel-dk: #b8962a; --sel-ink: #3a2b10; --leaf: #8fd879; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.65 }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 60px; display: flex; flex-direction: column; gap: 16px }
header { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: flex-end; justify-content: space-between }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 3.4vw, 34px); margin: 0; line-height: 1.15; text-wrap: balance }
.eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; color: var(--muted) }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted) }
.stats b { font-family: var(--display); font-size: 20px; color: var(--ink); font-variant-numeric: tabular-nums; margin-right: 2px }
nav { display: flex; gap: 6px; flex-wrap: wrap }
button { font: inherit; cursor: pointer; color: inherit }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--sel-dk); outline-offset: 2px }
.tab { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 6px 14px; font-weight: 700 }
.tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px; font-size: 12px }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink) }
.grid2 { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 16px; align-items: start }
@media (max-width: 980px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0 }
.sticky { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 10px) }
@media (max-width: 980px) { .sticky { position: static } }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.muted { color: var(--muted); font-size: 12.5px }
h2 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0; line-height: 1.25; text-wrap: balance }
h3 { font-family: var(--display); font-weight: 800; font-size: 16px; margin: 0 }
canvas { display: block; width: 100%; border-radius: 10px }
#map { touch-action: manipulation; cursor: pointer; background: var(--sea) }
.ma { font-family: var(--mono); font-size: 12.5px; color: var(--accent); white-space: nowrap }
.pill { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 1px 7px; background: var(--chip) }
.pill.lm { background: #f2c14e; color: #3a2d10 }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 12px }
@media (max-width: 640px) { .two { grid-template-columns: minmax(0, 1fr) } }
.ref img { width: 100%; border-radius: 10px; display: block; border: 1px solid var(--line) }
.ref figcaption { font-size: 12px; color: var(--muted); margin-top: 4px }
.list { display: flex; flex-direction: column; gap: 6px; max-height: 520px; overflow-y: auto }
.item { display: flex; gap: 10px; align-items: center; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 7px 10px; width: 100% }
.item[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset }
.item .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 13px }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none }
.step { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 10px }
.step-h { display: flex; justify-content: space-between; align-items: center; gap: 8px }
.done { border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; font-size: 12px; background: var(--panel) }
.done[aria-pressed="true"] { background: var(--ok); color: var(--bg); border-color: var(--ok) }
.dz { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 10px; align-items: start }
.dz img { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line) }
.parts { display: flex; gap: 4px; flex-wrap: wrap }
.parts span { font-size: 11.5px; background: var(--chip); border-radius: 999px; padding: 1px 8px }
.badge { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; flex: none }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px }
.mk { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--bg); flex: none }
.layers { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 6px 10px; font-size: 13px }
.band { border-radius: 6px; padding: 0 8px; font-weight: 700; text-align: center; color: #23302c }
ol.fix { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 13.5px }
.no { font-family: var(--mono); font-size: 11.5px; font-weight: 700; background: var(--ink); color: var(--bg); border-radius: 5px; padding: 0 6px }
.pill.ok { background: var(--ok); color: var(--bg) }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
.opt { display: flex; flex-direction: column; gap: 4px; text-align: left; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 6px; font-size: 12.5px }
.opt[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset }
.opt img, .opt .noimg { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: grid; place-items: center; background: var(--chip) }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px }
#refs { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px }
#refs .card img { aspect-ratio: 1 / 1 }
#refs .b { padding: 6px 8px; gap: 2px; font-size: 11.5px }
/* いいね／ふつう／イマイチ（カードの小さいボタン） */
.rate3 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px }
.rate3 button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 2px 0; font-size: 11px; cursor: pointer; transition: background .12s, border-color .12s, color .12s }
.rate3 .top:hover { border-color: var(--top); color: var(--top) } .rate3 .top[aria-pressed="true"] { background: var(--top); border-color: var(--top); color: var(--bg) }
.rate3 .up:hover { border-color: var(--ok); color: var(--ok) } .rate3 .mid:hover { border-color: var(--mid); color: var(--mid) } .rate3 .dn:hover { border-color: var(--accent); color: var(--accent) }
.rate3 .up[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--bg) } .rate3 .mid[aria-pressed="true"] { background: var(--mid); border-color: var(--mid); color: var(--bg) } .rate3 .dn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
#refs .card { transition: transform .15s, box-shadow .15s } #refs .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgb(0 0 0 / .12) }
/* 作例の審査：Dota2 の飾りの投票のように、大きな画像を1枚ずつ。いいね／ふつう／イマイチ */
/* 集めた作例・作例の審査のタブも、ほかと同じ幅と左右の余白に */
#tab-refs, #tab-vote { max-width: 1440px; margin: 0 auto; padding-inline: 16px; padding-block: 0 60px }
#tab-vote { display: flex; flex-direction: column; gap: 10px }
/* 画像は画面の高さに収め、右の評価パネルはスクロールしても動かない */
.vstage { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start }
#vSide { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); max-height: calc(100vh - 16px); overflow-y: auto }
.vctl { display: flex; flex-direction: column; gap: 8px }
.vmode { display: inline-flex; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; align-self: flex-start; max-width: 100% }
.vmode button { border: 0; background: var(--panel); padding: 8px 14px; font-weight: 700; font-size: 13.5px; cursor: pointer } .vmode button + button { border-left: 1px solid var(--line) }
.vmode button[aria-selected="true"] { background: var(--ink); color: var(--bg) } .vmode button:hover:not([aria-selected="true"]) { background: var(--chip) }
.vstate { border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 700; background: var(--chip); color: var(--muted) }
.vstate.top { background: var(--top); color: var(--bg) } .vstate.up { background: var(--ok); color: var(--bg) } .vstate.mid { background: var(--mid); color: var(--bg) } .vstate.dn { background: var(--accent); color: var(--accent-ink) }
#vReview { display: flex; flex-direction: column; gap: 10px } #vReview[hidden] { display: none !important }
.vrgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px }
.vrcard { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0 }
.vrimg { border: 0; padding: 0; background: var(--chip); cursor: zoom-in; display: block } .vrimg img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block; transition: opacity .15s } .vrimg:hover img { opacity: .85 }
.vrb { padding: 8px; display: flex; flex-direction: column; gap: 6px }
.vrbtns { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px }
.vrbtns button { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 0; font-size: 12px; cursor: pointer; transition: background .12s, border-color .12s }
.vrbtns .top:hover { border-color: var(--top); color: var(--top) } .vrbtns .top[aria-pressed="true"] { background: var(--top); border-color: var(--top); color: var(--bg) }
.vrbtns .up:hover { border-color: var(--ok); color: var(--ok) } .vrbtns .mid:hover { border-color: var(--mid); color: var(--mid) } .vrbtns .dn:hover { border-color: var(--accent); color: var(--accent) }
.vrbtns .up[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--bg) } .vrbtns .mid[aria-pressed="true"] { background: var(--mid); border-color: var(--mid); color: var(--bg) } .vrbtns .dn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.vrsel { display: flex; gap: 6px; align-items: center; font-size: 11.5px } .vrsel select { font: inherit; flex: 1; min-width: 0; padding: 2px 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink) }
.vtoast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); z-index: 30; display: flex; gap: 12px; align-items: center; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 13.5px; box-shadow: 0 6px 24px rgb(0 0 0 / .25); max-width: calc(100vw - 32px) }
.vtoast button { border: 1px solid currentColor; background: transparent; color: inherit; border-radius: 8px; padding: 4px 10px; font-weight: 700; cursor: pointer } .vtoast .kbd { color: inherit; border-color: currentColor }
@media (max-width: 860px) { .vtoast { bottom: calc(env(safe-area-inset-bottom, 0px) + 200px) } }
.vfilt summary { cursor: pointer; font-size: 12.5px; color: var(--muted); padding: 2px 0 } .vfilt[open] summary { margin-bottom: 6px }
.vfilt > div { display: flex; flex-direction: column; gap: 6px }
.vstriph { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted) }
.vpager { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap } .vpager button { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 10px; font-size: 12.5px; cursor: pointer } .vpager button:hover:not(:disabled) { border-color: var(--ink) } .vpager button:disabled { opacity: .4; cursor: default }
/* スマホ：評価のボタンは画面の下に固定 */
@media (max-width: 860px) {
  .vstage { grid-template-columns: minmax(0, 1fr) }
  #vSide { position: static; max-height: none; overflow: visible }
  .vctl { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); padding: 8px 12px calc(env(safe-area-inset-bottom, 0px) + 8px); box-shadow: 0 -4px 16px rgb(0 0 0 / .12) }
  .vctl .vbtn { padding: 8px 4px 6px } .vctl .vbtn svg { width: 18px; height: 18px } .vkeys, .vctl .kbd { display: none }
  #tab-vote { padding-bottom: 230px }
}
.vimg { position: relative; background: var(--chip); border-radius: 14px; overflow: hidden; min-height: 320px; display: grid; place-items: center; user-select: none }
.vimg img { display: block; width: 100%; max-height: calc(100vh - 150px); object-fit: contain; cursor: zoom-in; transition: transform .2s, filter .3s }
.vimg img.zoomed { cursor: zoom-out; transform: scale(2.4); transition: transform .2s; position: relative; z-index: 1 }
/* 同じ作例が2枚：同じ大きさで左右に。3枚以上：選んだ1枚を大きく、ほかは下に縮小 */
.vduo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px; width: 100%; overflow: hidden }
.vduo img { max-height: calc(100vh - 150px) }
.vmulti { display: flex; flex-direction: column; width: 100%; overflow: hidden }
.vmulti > img { max-height: calc(100vh - 230px) }
.vthn { align-self: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 0 6px }
.vthumbs { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; justify-content: center; background: var(--panel) }
.vthumbs button { width: 72px; height: 72px; padding: 0; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--chip); transition: border-color .12s, transform .12s }
.vthumbs button:hover { border-color: var(--ink); transform: translateY(-2px) } .vthumbs button[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) }
.vthumbs img { width: 100%; height: 100%; object-fit: cover; max-height: none; cursor: pointer }
.vgrp { font-size: 12px; font-weight: 700; color: var(--ok) }
.vkind { display: flex; gap: 4px; align-items: center; flex-wrap: wrap } .vkind button { border: 0; border-radius: 999px; padding: 2px 10px; font-size: 12px; background: var(--chip); box-shadow: 0 2px 0 var(--shade); cursor: pointer } .vkind button[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); box-shadow: 0 2px 0 var(--sel-dk) }
.vimg:has(.vmulti) .vhint { bottom: 10px; top: auto }
/* 画像の左右のはし：クリックで前・次 */
.vedge { position: absolute; top: 0; bottom: 0; width: 14%; border: 0; display: grid; place-items: center; font-size: 34px; color: #fff; background: transparent; opacity: 0; transition: opacity .15s, background .15s; z-index: 2 }
.vedge.l { left: 0 } .vedge.r { right: 0 }
.vimg:hover .vedge { opacity: .55 } .vedge:hover { opacity: 1 !important; background: linear-gradient(var(--dir), rgb(0 0 0 / .45), transparent) }
.vedge.l { --dir: 90deg } .vedge.r { --dir: 270deg }
.vimg:has(img.zoomed) .vedge { display: none }
.vhint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); font-size: 11.5px; color: #fff; background: rgb(0 0 0 / .5); border-radius: 99px; padding: 2px 10px; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap }
.vimg:hover .vhint { opacity: 1 }
/* 投票したときのはんこ */
.vstamp { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 3 }
.vstamp span { font-family: var(--display); font-weight: 800; font-size: clamp(28px, 6vw, 54px); padding: 6px 26px; border-radius: 16px; border: 4px solid currentColor; background: rgb(255 255 255 / .85); transform: rotate(-8deg); animation: stamp .55s ease-out forwards }
.vstamp .top { color: var(--top) } .vstamp .up { color: var(--ok) } .vstamp .mid { color: var(--mid) } .vstamp .dn { color: var(--accent) }
@keyframes stamp { 0% { transform: rotate(-8deg) scale(1.6); opacity: 0 } 30% { transform: rotate(-8deg) scale(1); opacity: 1 } 75% { opacity: 1 } 100% { opacity: 0 } }
/* 次に出る作例の列：クリックで飛ぶ */
.vstrip { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px }
.vstrip button { width: 100%; aspect-ratio: 1 / 1; max-width: 100%; padding: 0; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--chip); position: relative; transition: transform .12s, border-color .12s }
.vstrip button:hover { transform: translateY(-2px); border-color: var(--ink) } .vstrip button[aria-current="true"] { border-color: var(--accent) }
.vstrip img { width: 100%; height: 100%; object-fit: cover; display: block }
/* 評価は画像の下のはしの色の帯で（画像を隠さない）。くわしくはマウスを乗せると出る */
.vstrip i { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; font-size: 0 }
.vstrip i.top { background: var(--top) } .vstrip i.up { background: var(--ok) } .vstrip i.mid { background: var(--mid) } .vstrip i.dn { background: var(--accent); color: var(--accent-ink) }
@media (prefers-reduced-motion: reduce) { .vstamp span, .vimg img, .vedge, .rate3 button, #refs .card { animation: none; transition: none } }
.vimg .ld { color: var(--muted); font-size: 13px; padding: 40px }
.vbtns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
/* めっちゃいいは1段目にいっぱいの幅で */
.vbtn.top { grid-column: 1 / -1; flex-direction: row; gap: 8px; padding: 10px 6px }
.vbtn { min-width: 0; border: 2px solid var(--line); background: var(--panel); border-radius: 12px; padding: 12px 4px 8px; font-weight: 700; font-size: 14px; display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center }
.vbtn svg { width: 22px; height: 22px; fill: currentColor }
.vbtn.up[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--bg) }
.vbtn.dn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink) }
.vbtn { cursor: pointer; transition: background .15s, border-color .15s, color .15s, transform .08s }
.vbtn:active, .vnav button:active { transform: scale(.96) }
.vbtn.up:hover { border-color: var(--ok); color: var(--ok) } .vbtn.mid:hover { border-color: var(--mid); color: var(--mid) } .vbtn.dn:hover { border-color: var(--accent); color: var(--accent) }
.vbtn.mid[aria-pressed="true"] { background: var(--mid); border-color: var(--mid); color: var(--bg) }
.vbtn.top:hover { border-color: var(--top); color: var(--top) } .vbtn.top[aria-pressed="true"] { background: var(--top); border-color: var(--top); color: var(--bg) } .vbtn.top[aria-pressed="true"]:hover { color: var(--bg) }
